# 배포용 설정. 화면과 API 를 같은 출처에서 서빙해 Frontend 소스를 고치지 않는다.
# 개발 중 Vite 가 하던 일(vite.config.js 의 /api 프록시)을 그대로 옮겨 온 것이다.
server {
    listen 80;
    server_name _;

    # proxy_pass 끝의 슬래시가 /api 접두사를 벗긴다. vite.config.js 의 rewrite 와 같은 결과다.
    location /api/ {
        proxy_pass http://backend:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # 세무 질문은 Backend 가 LLM 응답을 최대 120s 까지 기다린다
        # (core/config.py 의 LLM_TIMEOUT_CHAT_TAX). nginx 가 먼저 끊으면 안 된다.
        proxy_read_timeout 180s;
    }

    location / {
        root /usr/share/nginx/html;
        try_files $uri /index.html;
    }
}
